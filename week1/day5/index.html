<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Day 5 - JavaScript DOM and Events">
    <meta name="author" content="Raja Jadham">

    <title>Day 5 | JavaScript DOM</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>JavaScript DOM & Events</h1>
        <p>Day 5 - Interactive Webpage</p>
    </header>

    <main>

        <!-- =================================
             TASK 1 - INTERACTIVE BUTTONS
        ================================== -->

        <section>
            <h2>Interactive Buttons</h2>

            <p id="colorText">
                Change my color using the buttons.
            </p>

            <div class="button-group">
                <button id="redBtn">RED</button>
                <button id="greenBtn">GREEN</button>
                <button id="blueBtn">BLUE</button>
            </div>


            <label for="fontSelect">Select Font Family:</label>

            <select id="fontSelect">
                <option value="Arial">Arial</option>
                <option value="Georgia">Georgia</option>
                <option value="Courier New">Courier New</option>
                <option value="Verdana">Verdana</option>
            </select>


            <div class="button-group">
                <button id="increaseBtn">A+</button>
                <button id="decreaseBtn">A-</button>
            </div>


            <p id="styleText">
                Mouse over the buttons below to change my style.
            </p>

            <div class="button-group">
                <button id="boldBtn">Bold</button>
                <button id="italicBtn">Italic</button>
                <button id="underlineBtn">Underline</button>
            </div>
        </section>


        <!-- =================================
             TASK 2 - FORM VALIDATION
        ================================== -->

        <section>
            <h2>Simple Form Validation</h2>

            <form id="userForm">

                <label for="name">Name:</label>
                <input type="text" id="name" placeholder="Enter your name">

                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Enter your email">

                <button type="submit">Submit</button>

                <p id="formMessage"></p>

            </form>
        </section>


        <!-- =================================
             TASK 3 - SIMPLE CALCULATOR
        ================================== -->

        <section>
            <h2>Simple Calculator</h2>

            <input
                type="number"
                id="num1"
                placeholder="Enter first number"
            >

            <input
                type="number"
                id="num2"
                placeholder="Enter second number"
            >

            <div class="calculator-buttons">
                <button id="addBtn">Add</button>
                <button id="subtractBtn">Subtract</button>
                <button id="multiplyBtn">Multiply</button>
                <button id="divideBtn">Divide</button>
            </div>

            <p id="calcResult"></p>
        </section>


        <!-- =================================
             BONUS - THEME SWITCHER
        ================================== -->

        <section>
            <h2>Theme Switcher</h2>

            <button id="lightBtn">Light</button>
            <button id="darkBtn">Dark</button>

        </section>

    </main>


    <footer>
        <p>© 2026 Raja Jadham | Day 5</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
