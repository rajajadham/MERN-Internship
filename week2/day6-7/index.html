<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App | Raja Jadham</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="weather-app">

        <section class="weather-card">

            <div class="app-header">
                <p class="eyebrow">LIVE WEATHER</p>
                <h1>Weather App</h1>
                <p class="subtitle">
                    Check current weather conditions for any city.
                </p>
            </div>


            <!-- Search -->
            <form id="weatherForm" class="search-form">

                <input
                    type="text"
                    id="cityInput"
                    placeholder="Enter city name..."
                    autocomplete="off"
                    required
                >

                <button type="submit" id="searchBtn">
                    Search
                </button>

            </form>


            <!-- Loading -->
            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>Fetching weather...</p>
            </div>


            <!-- Error -->
            <div id="errorMessage" class="error-message hidden">
            </div>


            <!-- Weather Result -->
            <section id="weatherResult" class="weather-result hidden">

                <div class="location">
                    <p>Current Weather</p>
                    <h2 id="cityName">Delhi</h2>
                </div>


                <div class="weather-main">

                    <img
                        id="weatherIcon"
                        src=""
                        alt="Weather icon"
                    >

                    <div class="temperature">
                        <span id="temperature">--</span>
                        <span>°C</span>
                    </div>

                </div>


                <p id="weatherCondition" class="condition">
                    Weather condition
                </p>


                <div class="weather-details">

                    <div class="detail-card">
                        <span>💧</span>
                        <p>Humidity</p>
                        <strong id="humidity">--%</strong>
                    </div>


                    <div class="detail-card">
                        <span>💨</span>
                        <p>Wind Speed</p>
                        <strong id="windSpeed">-- km/h</strong>
                    </div>


                    <div class="detail-card">
                        <span>🌡️</span>
                        <p>Feels Like</p>
                        <strong id="feelsLike">--°C</strong>
                    </div>

                </div>

            </section>

        </section>

    </main>


    <footer>
        <p>Built with HTML, CSS & JavaScript</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
